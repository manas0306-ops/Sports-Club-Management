<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}The Champions Club{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <script defer src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/club.css"><script defer src="/static/club.js"></script>
</head><body data-expiry="{{m.expiry if m is defined and m and m.expiry else ''}}" data-tier="{{effective(m) if m is defined and m else 'Free'}}">
        <header><div class="wrap nav">
        <a class="brand" href="/"><span class="crest" aria-hidden="true">C<span>C</span>
    </span>The Champions Club</a><button class="mobile" type="button" onclick="document.querySelector('nav').classList.toggle('show')">Menu</button>
    <nav><a href="/#availability">Courts</a><a href="/#membership">Membership</a>
        <a href="/#gear">Pro shop</a>{% if user %}<a href="/dashboard">Workspace</a>
        <form data-action="logout"><button class="ghost">Sign out</button></form>{% else %}<a class="btn" href="/login">Member sign in ↗</a>{% endif %}</nav>
    </div></header><main class="wrap">{% block body %}{% endblock %}

        </main><footer class="wrap">The Champions Club <span>Member services · Club time IST</span>
</footer><div id="status" role="status" aria-live="polite" hidden></div>
</body>
</html>
